<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Goal-Scoring Moment — Strategy Tutorial</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf6ff}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="strategy.html?v=20260818k" title="Strategy Mode Tutorial"></iframe><script>
const f=document.getElementById('game');
function install(){
 const d=f.contentDocument;if(!d)return;
 const st=d.createElement('style');st.textContent=`.realCardHost{padding:0!important;overflow:hidden!important;background:transparent!important}.realCardArt{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:#fff;border-radius:6px}.face.realCardHost{border:0!important;background:transparent!important}.flowStep.realCardHost{width:33px;height:44px;display:inline-flex!important;padding:0!important;border-radius:4px;background:transparent!important;overflow:hidden!important}.pc.realCardHost{padding:0!important;background:transparent!important;border:0!important;overflow:hidden!important}.mini.realCardHost{padding:0!important;background:transparent!important;overflow:hidden!important}.manualBox{padding-bottom:8px!important}.manualLead{font-size:13px!important;line-height:1.55!important}.manualToc{grid-template-columns:1fr 1fr!important}.manualToc a{font-size:10px!important;line-height:1.25!important}.chapter h3{font-size:17px!important}.chapter p,.chapter li{font-size:12px!important;line-height:1.62!important}.kidRule{background:#eef7ff;border:2px solid #9fc7eb;border-radius:10px;padding:9px;margin:7px 0;font-size:12px;font-weight:800;line-height:1.5}.flowCase{border:2px solid #c5d9ec;border-radius:12px;background:#fff;padding:9px;margin:9px 0}.flowCase.good{border-color:#48a875;background:#f1fff7}.flowCase.stop{border-color:#e39b4f;background:#fff8ee}.flowCase.chain{border-color:#6b8fd8;background:#f4f7ff}.flowTitle{font-size:12px;font-weight:950;color:#123a73;margin-bottom:6px}.flowLine{background:#123a73;color:#fff;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:950;line-height:1.45;margin-bottom:6px}.result{font-size:12px;line-height:1.55;font-weight:800;color:#29445f}.ballResult{display:block;margin-top:5px;color:#8c4f00;font-weight:950}.tinyCheck{font-size:11px;line-height:1.5;background:#fff5ce;border-left:5px solid #e5bb3c;border-radius:8px;padding:8px;margin:7px 0}.turnBox{display:grid;grid-template-columns:auto 1fr;gap:7px 9px;align-items:start}.turnNum{width:24px;height:24px;border-radius:50%;background:#123a73;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:950}.turnText{font-size:12px;line-height:1.55;font-weight:750;color:#314a64}.manualCloseWrap{z-index:2}@media(max-width:700px){.manualToc{grid-template-columns:1fr!important}.manualToc a{font-size:11px!important}.chapter{padding:10px!important}.chapter p,.chapter li,.kidRule,.result,.turnText{font-size:12px!important}.flowLine{font-size:10px!important}}`;d.head.appendChild(st);
 const ASSETS={SHOOT:'images/shoot-card.png?v=20260818k',DEFENSE:'images/defense-card.png?v=20260818k',TACKLE:'images/tackle-card.png?v=20260818k',DRIBBLE:'images/dribble%20past-card.png?v=20260818k'};const loaded=new Set();
 function info(t){if(t.includes('SHOOT'))return['SHOOT','SHOOT card'];if(t.includes('DEFENSE'))return['DEFENSE','DEFENSE card'];if(t.includes('TACKLE'))return['TACKLE','TACKLE card'];if(t.includes('DRIBBLE PAST')||t==='DRIBBLE')return['DRIBBLE','DRIBBLE PAST card'];return null}
 const patchCards=()=>{d.querySelectorAll('.face,.pc,.flowStep,.mini').forEach(el=>{if(el.querySelector('.realCardArt'))return;const t=(el.textContent||'').replace(/\s+/g,' ').trim(),m=info(t);if(!m)return;const key=m[0];const urgent=el.classList.contains('flowStep')||el.classList.contains('pc')||!!el.closest('.card.target');if(!urgent&&!loaded.has(key))return;el.classList.add('realCardHost');const img=d.createElement('img');img.className='realCardArt';img.src=ASSETS[key];img.alt=m[1];img.decoding='async';el.textContent='';el.appendChild(img)});d.querySelectorAll('a[href="index.html"]').forEach(a=>a.target='_top')};
 function installManual(){const box=d.querySelector('#manualModal .manualBox');if(!box)return;box.innerHTML=`<div class="eyebrow" style="text-align:center">STRATEGY MODE</div><h2>COMPLETE RULEBOOK</h2><div class="manualLead"><strong>Read this from top to bottom the first time you play.</strong><br>Every important attack path below says whether it succeeds or fails, whether a Token is added, and exactly who gets the Soccer Card.</div><div class="manualToc"><a href="#r1">1. Goal</a><a href="#r2">2. Teams</a><a href="#r3">3. Secret Roles</a><a href="#r4">4. Set Up</a><a href="#r5">5. Who Goes First</a><a href="#r6">6. Turn Order</a><a href="#r7">7. Your Turn</a><a href="#r8">8. PASS</a><a href="#r9">9. SHOOT</a><a href="#r10">10. DEFENSE</a><a href="#r11">11. DRIBBLE PAST</a><a href="#r12">12. Second DEFENSE</a><a href="#r13">13. TACKLE</a><a href="#r14">14. YELLOW</a><a href="#r15">15. Tokens</a><a href="#r16">16. Goalkeeper Passive</a><a href="#r17">17. ALL Attack Results</a><a href="#r18">18. Same-Turn Combos</a><a href="#r19">19. End Turn</a><a href="#r20">20. Win</a></div><section class="chapter" id="r1"><h3>1 — Goal of the Game</h3><p>Your team is trying to eliminate the other team's Goalkeeper.</p><div class="kidRule">A normal successful attack gives the target <strong>1 Soccer Token</strong>. A normal Player with 3 Tokens is out. Eliminate the opposing Goalkeeper to win immediately.</div></section><section class="chapter" id="r2"><h3>2 — Make the Teams</h3><ol><li>Make a Blue Team and a Green Team.</li><li>Keep the teams as even as possible.</li><li>Your team color is public.</li></ol></section><section class="chapter" id="r3"><h3>3 — Secret Roles</h3><ol><li>Each team has exactly 1 Goalkeeper.</li><li>Everyone else is a Player.</li><li>At the start, keep the Goalkeeper identity secret.</li><li>At 0 or 1 Token, the Role stays hidden.</li><li>When a player reaches <strong>2 Tokens</strong>, reveal the Role. If that player is the Goalkeeper, the Goalkeeper passive skill is now armed automatically.</li></ol><div class="tinyCheck">The Goalkeeper does not choose when to activate the skill. It is passive.</div></section><section class="chapter" id="r4"><h3>4 — Set Up the Table</h3><div class="turnBox"><div class="turnNum">1</div><div class="turnText">Shuffle the Action Cards.</div><div class="turnNum">2</div><div class="turnText">Deal 5 Action Cards to every player.</div><div class="turnNum">3</div><div class="turnText">Keep hands hidden.</div><div class="turnNum">4</div><div class="turnText">Put Soccer Tokens where everyone can reach them.</div><div class="turnNum">5</div><div class="turnText">Keep the Soccer Card separate. It shows who has the ball.</div></div></section><section class="chapter" id="r5"><h3>5 — Who Goes First</h3><ol><li>Use Rock–Paper–Scissors.</li><li>The winning side attacks first.</li><li>The first player on that side gets the Soccer Card.</li></ol></section><section class="chapter" id="r6"><h3>6 — Turn Order</h3><p>Choose one fixed order and keep using it.</p><div class="flowLine">BLUE 1 → GREEN 1 → BLUE 2 → GREEN 2 → repeat</div><div class="kidRule">PASS changes possession only. PASS does not change whose turn it is.</div></section><section class="chapter" id="r7"><h3>7 — Your Turn, Step by Step</h3><div class="turnBox"><div class="turnNum">1</div><div class="turnText"><strong>Draw 1 Action Card.</strong></div><div class="turnNum">2</div><div class="turnText">Play any legal cards you want.</div><div class="turnNum">3</div><div class="turnText">You may PASS, SHOOT, respond to a chain, TACKLE the ball back, or continue another legal action.</div><div class="turnNum">4</div><div class="turnText"><strong>Your turn does not end automatically.</strong></div><div class="turnNum">5</div><div class="turnText">Your turn ends only when you say <strong>“My turn is over.”</strong></div></div></section><section class="chapter" id="r8"><h3>8 — PASS</h3><ol><li>You must have the Soccer Card.</li><li>Choose a living teammate.</li><li>Give that teammate the Soccer Card.</li><li>Your turn is still your turn.</li></ol><div class="flowCase chain"><div class="flowTitle">PASS RESULT</div><div class="flowLine">YOU ⚽ → PASS → TEAMMATE ⚽</div><div class="result">No Token. No new turn starts.</div></div></section><section class="chapter" id="r9"><h3>9 — SHOOT</h3><ol><li>You must have the Soccer Card.</li><li>Play SHOOT.</li><li>Choose one living opponent.</li><li>Give the defending side a chance to respond.</li></ol><div class="flowCase good"><div class="flowTitle">SHOOT SUCCESS — NO DEFENSE</div><div class="flowLine">SHOOT → NO DEFENSE → GOAL</div><div class="result">Target gets <strong>+1 Token</strong>.<span class="ballResult">⚽ Soccer Card goes to the player who was scored on.</span></div></div></section><section class="chapter" id="r10"><h3>10 — DEFENSE</h3><p>The target or a living teammate may use DEFENSE against SHOOT.</p><div class="flowCase stop"><div class="flowTitle">DEFENSE SUCCESS</div><div class="flowLine">SHOOT → DEFENSE → STOPPED</div><div class="result">Target gets <strong>0 Tokens</strong>.<span class="ballResult">⚽ Soccer Card goes to the player who played the successful DEFENSE.</span></div></div></section><section class="chapter" id="r11"><h3>11 — DRIBBLE PAST</h3><p>After the first DEFENSE, the attacker may use DRIBBLE PAST to beat that DEFENSE and keep the same attack alive.</p><div class="flowCase good"><div class="flowTitle">DRIBBLE PAST SUCCESS — NO SECOND DEFENSE</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → NO SECOND DEFENSE → GOAL</div><div class="result">Target gets <strong>+1 Token</strong>.<span class="ballResult">⚽ Soccer Card goes to the player who was scored on.</span></div></div><div class="tinyCheck">In Strategy Mode, DRIBBLE PAST does not look at the Draw Pile.</div></section><section class="chapter" id="r12"><h3>12 — Second DEFENSE</h3><p>After DRIBBLE PAST, the defending side may try one more DEFENSE.</p><ol><li>Play DEFENSE.</li><li>Also discard 1 extra card.</li><li>If you cannot discard the extra card, you cannot use this second DEFENSE.</li></ol><div class="flowCase stop"><div class="flowTitle">SECOND DEFENSE SUCCESS</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → DEFENSE + DISCARD 1 → STOPPED</div><div class="result">Target gets <strong>0 Tokens</strong>.<span class="ballResult">⚽ Soccer Card goes to the player who played the successful second DEFENSE.</span></div></div></section><section class="chapter" id="r13"><h3>13 — TACKLE</h3><p>Use TACKLE on your own turn to take the Soccer Card from the player who has it.</p><ol><li>Play TACKLE.</li><li>Take the Soccer Card.</li><li>If your turn is still active and you have SHOOT, you may attack again.</li></ol><div class="kidRule">DEFENSE does not stop TACKLE.</div></section><section class="chapter" id="r14"><h3>14 — YELLOW CARD</h3><p>Use YELLOW CARD on your own turn. It skips the next living player in the fixed turn order once.</p><div class="flowLine">YOUR TURN → YELLOW → NEXT LIVING PLAYER SKIPPED</div></section><section class="chapter" id="r15"><h3>15 — Soccer Tokens & Elimination</h3><ul><li><strong>0 Tokens:</strong> still playing; Role hidden.</li><li><strong>1 Token:</strong> still playing; Role hidden.</li><li><strong>2 Tokens:</strong> still playing; <strong>reveal the Role now.</strong></li><li>If the revealed Role is a normal Player, the next successful goal gives Token 3 and that Player is out.</li><li>If the revealed Role is the Goalkeeper, the passive skill becomes armed automatically.</li><li>When a player is out, discard that player's whole hand.</li></ul></section><section class="chapter" id="r16"><h3>16 — Goalkeeper Passive Skill</h3><div class="kidRule"><strong>This skill is automatic. The Goalkeeper never chooses to activate it.</strong></div><ol><li>The Goalkeeper reaches <strong>2 Tokens</strong>.</li><li>Reveal the Goalkeeper Role immediately.</li><li>The Goalkeeper passive skill is now armed automatically.</li><li>Because the second goal was successful, normal possession applies: the <strong>Soccer Card is with that Goalkeeper</strong>.</li><li>The next opponent attack that would score the Goalkeeper's third Token is <strong>automatically canceled once</strong>.</li><li>No third Token is added on that canceled attack.</li><li>The Soccer Card goes to the Goalkeeper.</li><li>The passive skill is now used up.</li><li>The next successful goal against that Goalkeeper gives Token 3 and eliminates the Goalkeeper.</li></ol><div class="flowCase stop"><div class="flowTitle">PASSIVE TRIGGER + AUTOMATIC SAVE</div><div class="flowLine">GK GETS TOKEN 2 → REVEAL GK → PASSIVE ARMED → NEXT SCORING ATTACK AUTO-FAILS</div><div class="result">The canceled attack gives <strong>0 new Tokens</strong>.<span class="ballResult">⚽ Soccer Card goes to the Goalkeeper.</span></div></div></section><section class="chapter" id="r17"><h3>17 — ALL Attack Results</h3><div class="flowCase good"><div class="flowTitle">A. SHOOT SCORES</div><div class="flowLine">SHOOT → GOAL</div><div class="result">Target +1 Token.<span class="ballResult">⚽ Ball → scored-on player.</span></div></div><div class="flowCase stop"><div class="flowTitle">B. FIRST DEFENSE STOPS IT</div><div class="flowLine">SHOOT → DEFENSE → STOPPED</div><div class="result">0 Tokens.<span class="ballResult">⚽ Ball → successful defender.</span></div></div><div class="flowCase good"><div class="flowTitle">C. DRIBBLE PAST WINS</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → GOAL</div><div class="result">Target +1 Token.<span class="ballResult">⚽ Ball → scored-on player.</span></div></div><div class="flowCase stop"><div class="flowTitle">D. SECOND DEFENSE STOPS IT</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → DEFENSE + DISCARD 1 → STOPPED</div><div class="result">0 Tokens.<span class="ballResult">⚽ Ball → successful second defender.</span></div></div><div class="flowCase stop"><div class="flowTitle">E. GOALKEEPER PASSIVE SAVE</div><div class="flowLine">GK AT 2 TOKENS → NEXT SCORING ATTACK → AUTO-CANCELED</div><div class="result">0 new Tokens. Passive is used.<span class="ballResult">⚽ Ball → Goalkeeper.</span></div></div><div class="flowCase good"><div class="flowTitle">F. GOALKEEPER AFTER PASSIVE IS USED</div><div class="flowLine">PASSIVE USED → NEXT SUCCESSFUL GOAL → TOKEN 3</div><div class="result">Goalkeeper is eliminated. The attacking team wins immediately.</div></div></section><section class="chapter" id="r18"><h3>18 — Same-Turn Combos</h3><p>If your turn is still active, gaining or losing possession does not automatically end it.</p><div class="flowCase chain"><div class="flowTitle">AFTER A DEFENSE</div><div class="flowLine">YOUR SHOOT → DEFENSE → DEFENDER GETS BALL → TACKLE → YOU GET BALL → SHOOT AGAIN</div></div><div class="flowCase chain"><div class="flowTitle">AFTER A GOAL</div><div class="flowLine">YOUR SHOOT → GOAL → TARGET GETS BALL → TACKLE → YOU GET BALL → SHOOT AGAIN</div></div><div class="flowCase chain"><div class="flowTitle">GOALKEEPER FINISH</div><div class="flowLine">GK AT 2 → PASSIVE AUTO-SAVE → GK GETS BALL → TACKLE → SHOOT AGAIN → TOKEN 3 → WIN</div></div></section><section class="chapter" id="r19"><h3>19 — When Does Your Turn End?</h3><div class="kidRule"><strong>Your turn ends only when you say it ends.</strong></div><p>PASS, SHOOT, scoring, DEFENSE, DRIBBLE PAST, TACKLE, and the Goalkeeper passive save do not automatically end your turn. When you are done, say <strong>“My turn is over.”</strong></p></section><section class="chapter" id="r20"><h3>20 — How to Win</h3><p>Your team wins immediately when the opposing Goalkeeper is eliminated. You also win if every opponent has been eliminated.</p></section><div class="manualCloseWrap"><button class="btn green" id="manualClose2">CLOSE RULEBOOK</button></div>`;const close=box.querySelector('#manualClose2');if(close)close.onclick=()=>{const m=d.getElementById('manualModal');if(m)m.classList.remove('show')}}
 function patchLessonText(){const title=d.getElementById('tipTitle'),text=d.getElementById('tipText'),label=d.getElementById('tipLabel'),todo=d.getElementById('todo');if(title&&title.textContent==='2 TOKENS — STILL HIDDEN'){title.textContent='2 TOKENS — REVEAL THE ROLE';if(text)text.textContent='At 2 Tokens, reveal this player’s Role. If it is the Goalkeeper, the passive skill is armed automatically.';if(label)label.textContent='PASSIVE TRIGGER'}if(title&&title.textContent==='TUTORIAL REVEAL'){title.textContent='GOALKEEPER — PASSIVE ARMED';if(text)text.textContent='GREEN 1 is the Goalkeeper at 2 Tokens. The skill activates automatically; the Goalkeeper does not choose when to use it.';if(label)label.textContent='AUTOMATIC'}if(title&&title.textContent==='GOALKEEPER SAVE!'){title.textContent='PASSIVE SAVE — AUTOMATIC';if(text)text.textContent='The Goalkeeper already had 2 Tokens, so this next scoring attack is automatically canceled once. No third Token is added, and the Soccer Card goes to the Goalkeeper.';if(label)label.textContent='PASSIVE SKILL'}if(todo&&todo.textContent.includes('ROLE HIDDEN'))todo.textContent='GREEN 1 has 2 Tokens. Reveal the Role now; if it is the Goalkeeper, the passive skill is armed automatically.'}
 installManual();patchCards();patchLessonText();new MutationObserver(()=>{patchCards();patchLessonText()}).observe(d.body,{childList:true,subtree:true,characterData:true});const order=['SHOOT','DEFENSE','TACKLE','DRIBBLE'];function warm(i=0){if(i>=order.length)return;const key=order[i],img=new Image();img.decoding='async';img.onload=()=>{loaded.add(key);patchCards();setTimeout(()=>warm(i+1),120)};img.onerror=()=>setTimeout(()=>warm(i+1),120);img.src=ASSETS[key]}setTimeout(()=>warm(),700)}
f.addEventListener('load',install);
</script></body></html>
