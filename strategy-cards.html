<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Goal-Scoring Moment — Strategy Tutorial</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061421}
#game{display:block;width:100%;height:100dvh;max-height:100dvh;border:0;background:#061421}
@supports not (height:100dvh){#game{height:100vh;max-height:100vh}}
</style>
</head>
<body>
<iframe id="game" src="strategy-13.html?v=20260905all13b" title="Goal-Scoring Moment Strategy Tutorial — 13 Lessons" allow="fullscreen"></iframe>
<script>
const f=document.getElementById('game');
f.addEventListener('load',()=>{
  try{
    const d=f.contentDocument;
    if(!d)return;

    if(!d.getElementById('gsm-coach-all-css')){
      const l=d.createElement('link');
      l.id='gsm-coach-all-css';
      l.rel='stylesheet';
      l.href='strategy-13-coach-all.css?v=20260905all13b';
      d.head.appendChild(l);
    }

    const loadRuntimeFix=()=>{
      if(d.getElementById('gsm-strategy13-runtime-fix-loader'))return;
      const q=d.createElement('script');
      q.id='gsm-strategy13-runtime-fix-loader';
      q.src='strategy-13-runtime-fix.js?v=20260905all13b';
      d.body.appendChild(q);
    };

    const loadSafety=()=>{
      if(!d.getElementById('gsm-strategy13-safety-loader')){
        const s=d.createElement('script');
        s.id='gsm-strategy13-safety-loader';
        s.src='strategy-13-safety.js?v=20260905all13b';
        s.onload=loadRuntimeFix;
        s.onerror=loadRuntimeFix;
        d.body.appendChild(s);
      }else{
        loadRuntimeFix();
      }
    };

    if(!d.getElementById('gsm-coach-guide-v2-loader')){
      const g=d.createElement('script');
      g.id='gsm-coach-guide-v2-loader';
      g.src='strategy-13-coach-guide-v2.js?v=20260905all13b';
      g.onload=loadSafety;
      g.onerror=loadSafety;
      d.body.appendChild(g);
    }else{
      loadSafety();
    }
  }catch(e){console.error('Strategy 13 all-lesson coach loader failed',e)}
});
</script>
</body>
</html>
