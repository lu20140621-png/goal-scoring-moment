 const ASSETS={SHOOT:'images/shoot-card.png?v=20260818n',DEFENSE:'images/defense-card.png?v=20260818n',TACKLE:'images/tackle-card.png?v=20260818n',DRIBBLE:'images/dribble%20past-card.png?v=20260818n'};const loaded=new Set();

 const patchCards=()=>{d.querySelectorAll('.face,.pc,.flowStep,.mini').forEach(el=>{if(el.querySelector('.realCardArt'))return;const t=(el.textContent||'').replace(/\s+/g,' ').trim(),m=info(t);if(!m)return;const key=m[0];const urgent=el.classList.contains('flowStep')||el.classList.contains('pc')||!!el.closest('.card.target');if(!urgent&&!loaded.has(key))return;el.classList.add('realCardHost');const img=d.createElement('img');img.className='realCardArt';img.src=ASSETS[key];img.alt=m[1];img.decoding='async';el.textContent='';el.appendChild(img)});d.querySelectorAll('a[href="index.html"]').forEach(a=>a.target='_top')};
 function installManual(){const box=d.querySelector('#manualModal .manualBox');if(!box)return;box.innerHTML=`<div class="eyebrow" style="text-align:center">STRATEGY MODE</div><h2>COMPLETE RULEBOOK</h2><div class="manualLead"><strong>First game? Read this from top to bottom.</strong><br>This version explains normal play and the small situations that usually cause arguments: no cards, empty draw pile, skipped players, teammate DEFENSE, second DEFENSE, possession, and Goalkeeper timing.</div><div class="manualToc"><a href="#r1">1. Goal</a><a href="#r2">2. Teams & Roles</a><a href="#r3">3. Setup</a><a href="#r4">4. First Player</a><a href="#r5">5. Fixed Turn Order</a><a href="#r6">6. Eliminated Players</a><a href="#r7">7. Your Turn</a><a href="#r8">8. Empty Draw Pile</a><a href="#r9">9. No Cards / No Legal Play</a><a href="#r10">10. PASS</a><a href="#r11">11. SHOOT</a><a href="#r12">12. DEFENSE</a><a href="#r13">13. DRIBBLE PAST</a><a href="#r14">14. Second DEFENSE</a><a href="#r15">15. TACKLE</a><a href="#r16">16. YELLOW CARD</a><a href="#r17">17. Tokens & Reveal</a><a href="#r18">18. Goalkeeper Passive</a><a href="#r19">19. Possession Results</a><a href="#r20">20. Full Attack Chains</a><a href="#r21">21. End of Turn</a><a href="#r22">22. What Can I Do Now?</a><a href="#r23">23. Quick FAQ</a><a href="#r24">24. Winning</a></div>
<section class="chapter" id="r1"><h3>1 — Goal of the Game</h3><p>Your team wins by eliminating the opposing Goalkeeper.</p><div class="kidRule">A successful goal gives the target <strong>1 Soccer Token</strong>. A normal Player is out at 3 Tokens. The Goalkeeper reveals at 2 Tokens, arms an automatic one-time passive save, then can be eliminated by the next successful third-token goal after that save is used.</div></section>
<section class="chapter" id="r2"><h3>2 — Teams & Secret Roles</h3><ol><li>Split into Blue Team and Green Team as evenly as possible.</li><li>Each team has exactly <strong>1 Goalkeeper</strong>; everyone else is a Player.</li><li>Team color is public.</li><li>Role is secret at the start.</li><li>At 0 or 1 Token, keep the Role hidden.</li><li>At 2 Tokens, reveal the Role immediately.</li></ol><div class="tinyCheck">If the revealed Role is the Goalkeeper, the passive is armed automatically. The Goalkeeper never chooses when to activate it.</div></section>
<section class="chapter" id="r3"><h3>3 — Set Up</h3><ol><li>Shuffle all Action Cards.</li><li>Deal <strong>5 Action Cards</strong> to each player.</li><li>Keep hands hidden from opponents.</li><li>Put the remaining Action Cards face down as the Draw Pile.</li><li>Start a face-up Discard Pile next to it when cards are used.</li><li>Place Soccer Tokens where everyone can reach them.</li><li>Keep the Soccer Card separate from the Action deck. It shows who has possession.</li><li>Label players before starting: Blue 1, Green 1, Blue 2, Green 2, and so on.</li></ol></section>
<section class="chapter" id="r4"><h3>4 — Who Goes First</h3><ol><li>Use Rock–Paper–Scissors between the two sides.</li><li>The winning side attacks first.</li><li>The first player on that side receives the Soccer Card.</li><li>That player takes the first normal turn.</li></ol></section>
<section class="chapter" id="r5"><h3>5 — Fixed Turn Order</h3><p>Before play begins, set one fixed circular order. Alternate team colors when possible.</p><div class="flowLine">BLUE 1 → GREEN 1 → BLUE 2 → GREEN 2 → BLUE 1 → ...</div><ul><li>Do not rebuild the order after a goal.</li><li>Do not rebuild the order when possession changes.</li><li>PASS changes possession only.</li><li>Who has the Soccer Card and whose turn it is are two separate things.</li><li>A teammate can hold the Soccer Card while it is still your turn.</li></ul></section>
<section class="chapter" id="r6"><h3>6 — If Someone Is Eliminated</h3><p>An eliminated player's seat is skipped forever for normal turns. Do not renumber players and do not force colors to keep alternating.</p><div class="flowCase chain"><div class="flowTitle">EXAMPLE</div><div class="flowLine">BLUE 1 → GREEN 1 → BLUE 2 → GREEN 2</div><div class="result">If <strong>GREEN 1 is out</strong>, actual play becomes:<br><strong>BLUE 1 → BLUE 2 → GREEN 2 → BLUE 1 → ...</strong></div></div><ul><li>If the next seat is out, skip it immediately.</li><li>If several seats in a row are out, keep skipping until the next living player.</li><li>Two teammates may act one after another after an opponent is eliminated. That is correct.</li><li>The same “next living player” rule is used by YELLOW CARD.</li><li>When a normal Player is eliminated, discard that player's entire hand.</li></ul></section>
<section class="chapter" id="r7"><h3>7 — Your Normal Turn, Step by Step</h3><div class="turnBox"><div class="turnNum">1</div><div class="turnText"><strong>Draw 1 Action Card</strong>, unless your turn is skipped by YELLOW CARD.</div><div class="turnNum">2</div><div class="turnText">Check who currently has the Soccer Card.</div><div class="turnNum">3</div><div class="turnText">Play any legal cards you want. You may use more than one legal action in the same turn.</div><div class="turnNum">4</div><div class="turnText">Resolve every attack and response chain completely before starting another action.</div><div class="turnNum">5</div><div class="turnText">PASS, scoring, being defended, TACKLE, or losing possession does <strong>not</strong> automatically end your turn.</div><div class="turnNum">6</div><div class="turnText">When you have no more actions you want to take, say your turn is over. Move to the next living player.</div></div></section>
<section class="chapter" id="r8"><h3>8 — What If the Draw Pile Is Empty?</h3><ol><li>If a player must draw and the Draw Pile is empty, pause before drawing.</li><li>Take all Action Cards from the Discard Pile.</li><li>Shuffle them thoroughly.</li><li>Place them face down as a new Draw Pile.</li><li>Then the current player draws 1 normally.</li></ol><div class="warningBox">Never shuffle Role Cards, the Soccer Card, Soccer Tokens, cards still in players' hands, or cards currently being resolved into the new Draw Pile.</div></section>
<section class="chapter" id="r9"><h3>9 — What If You Have No Cards or No Legal Play?</h3><ul><li>Having 0 cards does <strong>not</strong> remove you from the game.</li><li>On your next normal turn, you still draw 1 card first.</li><li>If the card you draw can be legally used now, you may use it.</li><li>If it cannot be legally used, you may simply end your turn.</li><li>If you have the Soccer Card, you may still PASS even with 0 Action Cards because PASS does not require an Action Card.</li><li>If you do not have the Soccer Card and have no legal action, end your turn normally.</li><li>You are never forced to play an Action Card just because you have one.</li></ul></section>
<section class="chapter" id="r10"><h3>10 — PASS</h3><ol><li>PASS is used only on your own turn.</li><li>You must currently have the Soccer Card.</li><li>Choose a living teammate.</li><li>Give that teammate the Soccer Card.</li><li>No Token is added.</li><li>The teammate does not immediately take a turn.</li><li>Your own turn continues.</li></ol><div class="flowLine">YOU HAVE ⚽ → PASS → TEAMMATE HAS ⚽ → YOUR TURN CONTINUES</div></section>
<section class="chapter" id="r11"><h3>11 — SHOOT</h3><ol><li>You must have the Soccer Card.</li><li>Play SHOOT on your own turn.</li><li>Choose one living opponent as the target.</li><li>Pause and give the target's team a chance to discuss DEFENSE.</li><li>If nobody plays a successful DEFENSE, the attack scores.</li><li>The target receives +1 Token.</li><li>The Soccer Card goes to the player who was scored on.</li></ol><div class="flowLine">SHOOT → NO DEFENSE → GOAL → TARGET +1 TOKEN → BALL TO TARGET</div></section>
<section class="chapter" id="r12"><h3>12 — DEFENSE</h3><p>DEFENSE is a reaction to an attack. It can be played even when it is not that defender's normal turn.</p><ul><li>The player being targeted may play DEFENSE.</li><li>Any <strong>living teammate</strong> of the target may also play DEFENSE for them.</li><li>If more than one teammate has DEFENSE, the target and living teammates <strong>discuss and decide who will play it</strong>.</li><li>Only the person actually playing the successful DEFENSE becomes the successful defender.</li><li>If DEFENSE stops the attack, the target receives 0 Tokens.</li><li>The Soccer Card goes to the player who actually played the successful DEFENSE.</li><li>A player whose normal turn was skipped by YELLOW CARD may still play DEFENSE because DEFENSE is a reaction.</li></ul><div class="flowLine">SHOOT → TEAM DISCUSSES → ONE PLAYER USES DEFENSE → STOPPED → BALL TO THAT DEFENDER</div></section>
<section class="chapter" id="r13"><h3>13 — DRIBBLE PAST</h3><p>In Strategy Mode, DRIBBLE PAST is used after the first DEFENSE to beat that DEFENSE and keep the same attack alive.</p><ol><li>SHOOT is played.</li><li>The defending side plays its first DEFENSE.</li><li>The attacker plays DRIBBLE PAST.</li><li>The first DEFENSE is beaten.</li><li>The defending side now gets a chance to make a second DEFENSE.</li><li>If nobody makes the second DEFENSE, the attack scores.</li></ol><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → NO SECOND DEFENSE → GOAL</div><div class="tinyCheck">Strategy Mode DRIBBLE PAST does not look at the top of the Draw Pile.</div></section>
<section class="chapter" id="r14"><h3>14 — Second DEFENSE</h3><p>After DRIBBLE PAST, the target and all living teammates may discuss who should make the second DEFENSE. It does <strong>not</strong> have to be the same person who played the first DEFENSE.</p><ol><li>The chosen living defender plays a DEFENSE card.</li><li>After playing that DEFENSE, check the defender's remaining hand.</li><li>If the defender still has <strong>1 or more cards</strong>, that defender must discard 1 additional card.</li><li>If playing the DEFENSE leaves that defender with <strong>0 cards</strong>, no extra discard is required.</li><li>Therefore, a player whose only card is DEFENSE <strong>may still make the second DEFENSE</strong>.</li><li>If successful, the target receives 0 Tokens.</li><li>The Soccer Card goes to the person who actually played that successful second DEFENSE.</li></ol><div class="flowCase stop"><div class="flowTitle">ONE-CARD EXAMPLE</div><div class="flowLine">HAND = 1 DEFENSE → PLAY DEFENSE → HAND = 0 → NO EXTRA DISCARD</div><div class="result">The second DEFENSE is legal and successful.</div></div></section>
<section class="chapter" id="r15"><h3>15 — TACKLE</h3><div class="kidRule"><strong>TACKLE cannot be stopped by DEFENSE.</strong></div><ol><li>Use TACKLE on your own turn.</li><li>Choose the player who currently has the Soccer Card.</li><li>Play TACKLE.</li><li>Take the Soccer Card from that player.</li><li>No Token is given by TACKLE itself.</li><li>DEFENSE cannot cancel or block TACKLE.</li><li>If your turn is still active and you now have a legal SHOOT, you may attack in the same turn.</li></ol><div class="flowLine">OTHER PLAYER HAS ⚽ → TACKLE → YOU HAVE ⚽ → YOU MAY CONTINUE</div></section>
<section class="chapter" id="r16"><h3>16 — YELLOW CARD</h3><p>YELLOW CARD affects the <strong>next living player in the fixed turn order</strong>. You do not choose the target.</p><ul><li>If the next living player is an opponent, that opponent is skipped.</li><li>If the next living player is your teammate, your teammate is still skipped.</li><li>The skipped player does <strong>not draw a card</strong>.</li><li>The skipped player does not take a normal turn.</li><li>During that skipped turn they cannot PASS, SHOOT, TACKLE, DRIBBLE PAST as an on-turn action, or play another normal on-turn Action Card.</li><li>The skipped player remains alive and may still use DEFENSE as a reaction when their team is attacked.</li><li>After the skipped seat is passed over, continue to the next living player.</li></ul><div class="flowCase chain"><div class="flowTitle">TEAMMATE CAN BE HIT</div><div class="flowLine">ORDER AFTER ELIMINATION: BLUE 1 → BLUE 2 → GREEN 2</div><div class="result">If Blue 1 uses YELLOW, Blue 2 loses the next normal turn even though Blue 2 is a teammate.</div></div></section>
<section class="chapter" id="r17"><h3>17 — Soccer Tokens, Reveal & Elimination</h3><ul><li><strong>0 Tokens:</strong> alive; Role hidden.</li><li><strong>1 Token:</strong> alive; Role hidden.</li><li><strong>2 Tokens:</strong> alive; reveal the Role immediately.</li><li>If the revealed Role is a normal Player, a later successful third Token eliminates that Player.</li><li>If the revealed Role is the Goalkeeper, the passive is armed automatically.</li><li>When a normal Player is eliminated, discard their entire hand and skip their seat for all future turns.</li><li>If the eliminated Role is the Goalkeeper and the passive has already been used, the game ends immediately.</li></ul></section>
<section class="chapter" id="r18"><h3>18 — Goalkeeper Passive Skill</h3><div class="kidRule"><strong>Automatic passive. Never manually activated.</strong></div><ol><li>The Goalkeeper receives the second Token from a successful goal.</li><li>Reveal the Goalkeeper Role immediately.</li><li>Because that second goal succeeded, normal possession applies: the Soccer Card is with the Goalkeeper as the scored-on player.</li><li>The passive is now armed automatically.</li><li>The next opponent attack that would successfully give this Goalkeeper the third Token is automatically canceled once.</li><li>No third Token is added from that canceled attack.</li><li>The Soccer Card goes to the Goalkeeper.</li><li>The passive is now used up.</li><li>The next successful third-token goal eliminates the Goalkeeper and ends the game immediately.</li></ol><div class="flowLine">GK GETS TOKEN 2 → REVEAL → PASSIVE ARMED → NEXT WOULD-BE 3RD GOAL AUTO-FAILS → BALL TO GK</div></section>
<section class="chapter" id="r19"><h3>19 — Who Gets the Soccer Card?</h3><div class="flowCase good"><div class="flowTitle">SHOOT SCORES</div><div class="flowLine">SHOOT → GOAL</div><div class="result">Target +1 Token.<span class="ballResult">⚽ Ball → player who was scored on.</span></div></div><div class="flowCase stop"><div class="flowTitle">FIRST DEFENSE STOPS IT</div><div class="flowLine">SHOOT → DEFENSE → STOPPED</div><div class="result">0 Tokens.<span class="ballResult">⚽ Ball → actual successful defender.</span></div></div><div class="flowCase good"><div class="flowTitle">DRIBBLE PAST WINS</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → GOAL</div><div class="result">Target +1 Token.<span class="ballResult">⚽ Ball → player who was scored on.</span></div></div><div class="flowCase stop"><div class="flowTitle">SECOND DEFENSE WINS</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → SECOND DEFENSE → STOPPED</div><div class="result">0 Tokens.<span class="ballResult">⚽ Ball → actual second defender.</span></div></div><div class="flowCase chain"><div class="flowTitle">TACKLE</div><div class="flowLine">TACKLE → TAKE SOCCER CARD</div><div class="result">No Token. DEFENSE cannot stop it.</div></div><div class="flowCase stop"><div class="flowTitle">GOALKEEPER PASSIVE SAVE</div><div class="flowLine">WOULD-BE THIRD GOAL → PASSIVE AUTO-SAVE</div><div class="result">No third Token.<span class="ballResult">⚽ Ball → Goalkeeper.</span></div></div></section>
<section class="chapter" id="r20"><h3>20 — Full Attack Chains</h3><div class="flowCase good"><div class="flowTitle">A — CLEAN GOAL</div><div class="flowLine">SHOOT → GOAL</div><div class="result">+1 Token; ball to scored-on player.</div></div><div class="flowCase stop"><div class="flowTitle">B — FIRST DEFENSE WINS</div><div class="flowLine">SHOOT → DEFENSE → STOPPED</div><div class="result">0 Tokens; ball to the person who played DEFENSE.</div></div><div class="flowCase good"><div class="flowTitle">C — DRIBBLE WINS</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → NO SECOND DEFENSE → GOAL</div><div class="result">+1 Token; ball to scored-on player.</div></div><div class="flowCase stop"><div class="flowTitle">D — SECOND DEFENSE WINS</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → SECOND DEFENSE → STOPPED</div><div class="result">0 Tokens; ball to second defender. If that defender has cards left after playing DEFENSE, discard 1 more; if hand is 0, discard nothing.</div></div><div class="flowCase chain"><div class="flowTitle">E — TAKE BALL BACK AND ATTACK AGAIN</div><div class="flowLine">ATTACK RESOLVES → OTHER PLAYER HAS ⚽ → YOUR TURN STILL ACTIVE → TACKLE → YOU HAVE ⚽ → SHOOT AGAIN</div><div class="result">Legal because TACKLE is an own-turn possession action and DEFENSE cannot stop it.</div></div></section>
<section class="chapter" id="r21"><h3>21 — When Does a Turn End?</h3><ul><li>PASS does not automatically end your turn.</li><li>A successful goal does not automatically end your turn.</li><li>A stopped attack does not automatically end your turn.</li><li>TACKLE does not automatically end your turn.</li><li>Losing possession does not automatically end your turn.</li><li>Finish the current attack/reaction chain before starting a new action.</li><li>When you are done, end your turn and move to the next living player.</li><li>If that next living player is under YELLOW, skip that entire normal turn and continue to the next living player.</li></ul></section>
<section class="chapter" id="r22"><h3>22 — “What Can I Do Right Now?”</h3><div class="flowCase chain"><div class="flowTitle">YOUR TURN + YOU HAVE THE BALL</div><div class="result">Draw 1 → you may SHOOT, PASS, use another legal on-turn card, or end your turn.</div></div><div class="flowCase chain"><div class="flowTitle">YOUR TURN + SOMEONE ELSE HAS THE BALL</div><div class="result">Draw 1 → you cannot SHOOT unless you first gain possession → TACKLE may take the ball → then you may continue.</div></div><div class="flowCase chain"><div class="flowTitle">YOUR TURN + HAND = 0</div><div class="result">Draw 1 normally. If you still have no legal action, end your turn. If you have the Soccer Card, PASS is still available.</div></div><div class="flowCase stop"><div class="flowTitle">YOUR NORMAL TURN IS SKIPPED BY YELLOW</div><div class="result">Do not draw. Do not take normal on-turn actions. You may still DEFENSE later as a reaction if your team is attacked.</div></div><div class="flowCase stop"><div class="flowTitle">NOT YOUR TURN + YOUR TEAM IS ATTACKED</div><div class="result">If you are alive and have DEFENSE, you may discuss with the target and teammates whether you should play it.</div></div></section>
<section class="chapter" id="r23"><h3>23 — Quick FAQ</h3><ul><li><strong>Can a teammate DEFENSE for me?</strong> Yes, any living teammate can.</li><li><strong>Two teammates both want to DEFENSE. Who does it?</strong> The target and living teammates discuss and choose one player.</li><li><strong>Must the same person make the second DEFENSE?</strong> No. The target and living teammates discuss again.</li><li><strong>I only have one card and it is DEFENSE. Can I use it as the second DEFENSE?</strong> Yes. After you play it your hand is 0, so no extra discard is required.</li><li><strong>I have cards left after my second DEFENSE. Do I discard one?</strong> Yes, exactly 1 additional card.</li><li><strong>Can DEFENSE stop TACKLE?</strong> No.</li><li><strong>Can YELLOW skip my teammate?</strong> Yes.</li><li><strong>Can a YELLOW-skipped player DEFENSE?</strong> Yes, because DEFENSE is a reaction.</li><li><strong>Does PASS give my teammate the next turn?</strong> No. Turn order never changes because of PASS.</li><li><strong>What if the Draw Pile is empty?</strong> Shuffle the Discard Pile into a new Draw Pile, then draw.</li><li><strong>What if I have no cards?</strong> You still take your normal turn and draw 1 unless YELLOW skips you.</li></ul></section>
<section class="chapter" id="r24"><h3>24 — How to Win</h3><ol><li>Normal Players are eliminated by a third Token.</li><li>All Roles reveal at 2 Tokens.</li><li>A revealed Goalkeeper automatically gets one passive save against the next would-be third-token goal.</li><li>After that passive has been used, the next successful third-token goal eliminates the Goalkeeper.</li><li>The instant the opposing Goalkeeper is eliminated, the game ends and your team wins.</li></ol></section><div class="manualCloseWrap"><button class="btn" id="manualClose">CLOSE RULEBOOK</button></div>`;const c=box.querySelector('#manualClose');if(c)c.onclick=()=>d.querySelector('#manualModal').classList.remove('show')}
 installManual();patchCards();
 new MutationObserver(()=>{patchCards()}).observe(d.body,{childList:true,subtree:true,characterData:true});
