<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Goal-Scoring Moment — Strategy Tutorial</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111f}
#game{display:block;width:100%;height:100%;border:0;background:#06111f}
</style>
</head>
<body>
<iframe id="game" src="strategy.html?v=20260824mobile-final3" title="Strategy Mode Tutorial" allow="fullscreen"></iframe>
<script>
(function(){
  const frame=document.getElementById('game');
  frame.addEventListener('load',function(){
    const d=frame.contentDocument,w=frame.contentWindow;
    if(!d||!d.body)return;

    const st=d.createElement('style');
    st.textContent=`
      .fieldArrow{display:none!important}
      .gsmCoachPointer{position:fixed;z-index:999;pointer-events:none;transform:translateX(-50%);text-align:center;display:none}
      .gsmCoachPointer.show{display:block}
      .gsmCoachBubble{display:inline-block;background:#fff;color:#b72636;border:2px solid #e43b4d;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:950;white-space:nowrap;box-shadow:0 5px 14px #0007;animation:gsmCoachPulse .7s infinite alternate}
      .gsmCoachArrow{font-size:27px;line-height:22px;color:#ffd75a;text-shadow:0 2px 6px #061526,0 0 7px #ffd75a}
      @keyframes gsmCoachPulse{from{transform:scale(.98)}to{transform:scale(1.04)}}
      .gsmTargetModal{position:fixed;inset:0;z-index:1200;background:#061526d9;display:none;align-items:center;justify-content:center;padding:14px}
      .gsmTargetModal.show{display:flex}
      .gsmTargetBox{width:min(430px,94vw);background:#fffdf7;color:#10233d;border:4px solid #245e9e;border-top-color:#e43b4d;border-radius:18px;padding:15px;text-align:center;box-shadow:0 18px 50px #0009}
      .gsmTargetBox h3{margin:0 0 5px;color:#123a73;font-size:23px}
      .gsmTargetBox p{margin:0 0 12px;color:#50667c;font-size:12px;font-weight:700;line-height:1.4}
      .gsmTargetChoices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
      .gsmTargetBtn{border:3px solid #1b9154;background:#eefbf3;color:#0e5b36;border-radius:13px;padding:13px 8px;font-weight:950;font-size:14px;box-shadow:0 4px 0 #0d673b}
      .gsmTargetBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #0d673b}
      .gsmTargetBtn.goalkeeper{border-color:#e0ad24;background:#fff6cf;color:#725000;box-shadow:0 4px 0 #af7d12}
      .gsmTargetHint{min-height:20px;margin-top:10px;color:#bd2636;font-size:11px;font-weight:900}
      .gsmTargetCancel{margin-top:10px;border:0;background:#d9e4ef;color:#27445f;border-radius:9px;padding:8px 14px;font-weight:900}
      @media(max-width:760px){
        .gsmCoachBubble{font-size:9px;padding:4px 7px}.gsmCoachArrow{font-size:24px;line-height:19px}
        .gsmTargetBox{padding:13px}.gsmTargetBox h3{font-size:21px}.gsmTargetBtn{font-size:13px;padding:12px 6px}
      }
    `;
    d.head.appendChild(st);

    const pointer=d.createElement('div');
    pointer.className='gsmCoachPointer';
    pointer.innerHTML='<div class="gsmCoachBubble" id="gsmCoachText">TAP HERE</div><div class="gsmCoachArrow">↓</div>';
    d.body.appendChild(pointer);

    const modal=d.createElement('div');
    modal.className='gsmTargetModal';
    modal.innerHTML=`<div class="gsmTargetBox"><h3>CHOOSE YOUR TARGET</h3><p>SHOOT must target one living opponent.</p><div class="gsmTargetChoices"><button class="gsmTargetBtn" data-target="GREEN 1">GREEN 1</button><button class="gsmTargetBtn goalkeeper" data-target="GREEN 2">GREEN 2</button></div><div class="gsmTargetHint" id="gsmTargetHint"></div><button class="gsmTargetCancel">BACK</button></div>`;
    d.body.appendChild(modal);

    let bypass=false,lastRequestedButton=null;
    function lessonTitle(){return (d.getElementById('statusTitle')?.textContent||'').toUpperCase()}
    function isShootStep(){const t=lessonTitle();return t.includes('SHOOT')||t.includes('GOALKEEPER PASSIVE')}
    function introOpen(){return !!d.querySelector('#intro.show')}

    function refreshPointer(){
      if(introOpen()){pointer.classList.remove('show');return}
      const title=lessonTitle();
      let el=null,text='';
      if(title.includes('PASS')){el=d.getElementById('mainAction');text='TAP PASS SOCCER'}
      else{
        el=d.querySelector('.cardBtn.activeCard:not(:disabled)')||d.getElementById('mainAction');
        if(title.includes('GOALKEEPER PASSIVE')) text='TAP SHOOT';
        else if(title.includes('SECOND DEFENSE')||title.includes('DEFENSE')) text='TAP DEFENSE';
        else if(title.includes('DRIBBLE')) text='TAP DRIBBLE PAST';
        else if(title.includes('TACKLE')) text='TAP TACKLE';
        else if(title.includes('YELLOW')) text='TAP YELLOW CARD';
        else if(title.includes('SHOOT')) text='TAP SHOOT';
      }
      if(!el||el.disabled){pointer.classList.remove('show');return}
      const r=el.getBoundingClientRect();
      pointer.style.left=(r.left+r.width/2)+'px';
      pointer.style.top=Math.max(4,r.top-56)+'px';
      d.getElementById('gsmCoachText').textContent=text||'TAP HERE';
      pointer.classList.add('show');
    }

    function openTargetChooser(button){
      lastRequestedButton=button||d.querySelector('.cardBtn.activeCard:not(:disabled)');
      d.getElementById('gsmTargetHint').textContent='';
      const gk=lessonTitle().includes('GOALKEEPER PASSIVE');
      modal.querySelector('[data-target="GREEN 2"]').textContent=gk?'GREEN 2 • GOALKEEPER':'GREEN 2';
      modal.classList.add('show');
      pointer.classList.remove('show');
    }
    function closeTargetChooser(){modal.classList.remove('show');requestAnimationFrame(refreshPointer)}
    modal.querySelector('.gsmTargetCancel').onclick=closeTargetChooser;

    modal.querySelectorAll('.gsmTargetBtn').forEach(btn=>btn.addEventListener('click',function(){
      const target=this.dataset.target;
      const gk=lessonTitle().includes('GOALKEEPER PASSIVE');
      if(gk&&target!=='GREEN 2'){
        d.getElementById('gsmTargetHint').textContent='For this lesson, choose GREEN 2 — the Goalkeeper with 2 Tokens.';
        return;
      }
      closeTargetChooser();
      bypass=true;
      try{
        if(gk&&typeof w.playGK==='function') w.playGK(lastRequestedButton);
        else if(typeof w.playCard==='function') w.playCard('SHOOT',lastRequestedButton);
      }finally{setTimeout(()=>{bypass=false;refreshPointer()},80)}
    }));

    d.addEventListener('click',function(e){
      if(bypass||!isShootStep()||introOpen())return;
      const card=e.target.closest('.cardBtn.activeCard:not(:disabled)');
      const main=e.target.closest('#mainAction');
      if(!card&&!main)return;
      e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
      openTargetChooser(card||d.querySelector('.cardBtn.activeCard:not(:disabled)'));
    },true);

    const obs=new MutationObserver(()=>requestAnimationFrame(refreshPointer));
    ['hand','statusTitle','mainAction','intro'].forEach(id=>{const el=d.getElementById(id);if(el)obs.observe(el,{childList:true,subtree:true,characterData:true,attributes:true})});
    w.addEventListener('resize',refreshPointer);
    w.addEventListener('orientationchange',()=>setTimeout(refreshPointer,200));
    setTimeout(refreshPointer,250);
  });
})();
</script>
</body>
</html>
