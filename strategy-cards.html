kground:#fff0f1;border-left:5px solid #e33d4d;border-radius:8px;padding:8px;margin:7px 0;font-weight:800}.turnBox{display:grid;grid-template-columns:auto 1fr;gap:7px 9px;align-items:start}.turnNum{width:24px;height:24px;border-radius:50%;background:#123a73;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:950}.turnText{font-size:12px;line-height:1.55;font-weight:750;color:#314a64}.manualCloseWrap{z-index:2}@media(max-width:700px){.manualToc{grid-template-columns:1fr!important}.manualToc a{font-size:11px!important}.chapter{padding:10px!important}.chapter p,.chapter li,.kidRule,.result,.turnText{font-size:12px!important}.flowLine{font-size:10px!important}}`;d.head.appendChild(st);
 const ASSETS={SHOOT:'images/shoot-card.png?v=20260818m',DEFENSE:'images/defense-card.png?v=20260818m',TACKLE:'images/tackle-card.png?v=20260818m',DRIBBLE:'images/dribble%20past-card.png?v=20260818m'};const loaded=new Set();
 function info(t){if(t.includes('SHOOT'))return['SHOOT','SHOOT card'];if(t.includes('DEFENSE'))return['DEFENSE','DEFENSE card'];if(t.includes('TACKLE'))return['TACKLE','TACKLE card'];if(t.includes('DRIBBLE PAST')||t==='DRIBBLE')return['DRIBBLE','DRIBBLE PAST card'];return null}
 const patchCards=()=>{d.querySelectorAll('.face,.pc,.flowStep,.mini').forEach(el=>{if(el.querySelector('.realCardArt'))return;const t=(el.textContent||'').replace(/\s+/g,' ').trim(),m=info(t);if(!m)return;const key=m[0];const urgent=el.classList.contains('flowStep')||el.classList.contains('pc')||!!el.closest('.card.target');if(!urgent&&!loaded.has(key))return;el.classList.add('realCardHost');const img=d.createElement('img');img.className='realCardArt';img.src=ASSETS[key];img.alt=m[1];img.decoding='async';el.textContent='';el.appendChild(img)});d.querySelectorAll('a[href="index.html"]').forEach(a=>a.target='_top')};
 function installManual(){const box=d.querySelector('#manualModal .manualBox');if(!box)return;box.innerHTML=`<div class="eyebrow" style="text-align:center">STRATEGY MODE</div><h2>COMPLETE RULEBOOK</h2><div class="manualLead"><strong>First game? Read this from top to bottom.</strong><br>This version is written to remove table disputes: turn order, eliminated players, Yellow Card, attack chains, possession, Goalkeeper passive, and every common result are spelled out.</div><div class="manualToc"><a href="#r1">1. Goal</a><a href="#r2">2. Teams & Roles</a><a href="#r3">3. Setup</a><a href="#r4">4. First Player</a><a href="#r5">5. Fixed Turn Order</a><a href="#r6">6. If Someone Is Out</a><a href="#r7">7. Your Turn</a><a href="#r8">8. PASS</a><a href="#r9">9. SHOOT</a><a href="#r10">10. DEFENSE</a><a href="#r11">11. DRIBBLE PAST</a><a href="#r12">12. Second DEFENSE</a><a href="#r13">13. TACKLE</a><a href="#r14">14. YELLOW CARD</a><a href="#r15">15. Tokens & Reveal</a><a href="#r16">16. Goalkeeper Passive</a><a href="#r17">17. Possession Results</a><a href="#r18">18. Full Attack Chains</a><a href="#r19">19. End of Turn</a><a href="#r20">20. Winning</a></div>
<section class="chapter" id="r1"><h3>1 — Goal of the Game</h3><p>Your team wins by eliminating the opposing Goalkeeper.</p><div class="kidRule">A successful goal gives the target <strong>1 Soccer Token</strong>. A normal Player is out at 3 Tokens. A Goalkeeper has a one-time passive save after reaching 2 Tokens; after that save is used, the next successful third-token goal eliminates the Goalkeeper and ends the game.</div></section>
<section class="chapter" id="r2"><h3>2 — Teams & Secret Roles</h3><ol><li>Split into Blue Team and Green Team as evenly as possible.</li><li>Each team has exactly <strong>1 Goalkeeper</strong>; everyone else is a Player.</li><li>Team color is public. Role is secret at the start.</li><li>At 0 or 1 Token, keep the Role hidden.</li><li>At 2 Tokens, reveal the Role immediately.</li></ol><div class="tinyCheck">If the revealed Role is the Goalkeeper, the Goalkeeper passive is armed automatically. The Goalkeeper does not choose when to activate it.</div></section>
<section class="chapter" id="r3"><h3>3 — Set Up</h3><ol><li>Shuffle the Action Cards.</li><li>Deal <strong>5 Action Cards</strong> to each player.</li><li>Keep hands hidden from opponents.</li><li>Place Soccer Tokens where everyone can reach them.</li><li>Keep the Soccer Card separate from the Action deck. It shows current possession.</li><li>Agree on player labels before starting: Blue 1, Green 1, Blue 2, Green 2, and so on.</li></ol></section>
<section class="chapter" id="r4"><h3>4 — Who Goes First</h3><ol><li>Use Rock–Paper–Scissors between the two sides.</li><li>The winning side attacks first.</li><li>The first player on that side receives the Soccer Card and takes the first turn.</li></ol></section>
<section class="chapter" id="r5"><h3>5 — Fixed Turn Order</h3><p>Before play begins, set one fixed circular turn order. Alternate team colors when possible.</p><div class="flowLine">BLUE 1 → GREEN 1 → BLUE 2 → GREEN 2 → BLUE 1 → ...</div><ul><li>Do not rebuild the order after every goal.</li><li>Passing the Soccer Card does <strong>not</strong> change the turn order.</li><li>Who has the Soccer Card and whose turn it is are two different things.</li><li>A teammate may have the ball while it is still your turn.</li></ul></section>
<section class="chapter" id="r6"><h3>6 — If Someone Is Eliminated</h3><p>An eliminated player's seat is skipped for all future normal turns. Do not renumber everyone and do not force the colors to keep alternating.</p><div class="flowCase chain"><div class="flowTitle">EXAMPLE</div><div class="flowLine">BLUE 1 → GREEN 1 → BLUE 2 → GREEN 2</div><div class="result">If <strong>GREEN 1 is out</strong>, the effective order becomes:<br><strong>BLUE 1 → BLUE 2 → GREEN 2 → BLUE 1 → ...</strong></div></div><ul><li>When you reach an eliminated player in the original order, skip that seat immediately.</li><li>If several players are out, keep skipping until you reach the next living player.</li><li>The same rule determines who is “next” for YELLOW CARD.</li></ul><div class="warningBox">Important: two teammates may now act consecutively because an opponent between them was eliminated. That is correct.</div></section>
<section class="chapter" id="r7"><h3>7 — Your Turn, Step by Step</h3><div class="turnBox"><div class="turnNum">1</div><div class="turnText"><strong>Draw 1 Action Card</strong> at the start of your normal turn, unless your turn is being skipped by YELLOW CARD.</div><div class="turnNum">2</div><div class="turnText">Look at your hand and current possession.</div><div class="turnNum">3</div><div class="turnText">Play any legal Action Cards, PASS if you have the Soccer Card, SHOOT if you have the Soccer Card, or use TACKLE on your own turn to take the Soccer Card.</div><div class="turnNum">4</div><div class="turnText">Resolve every response and attack chain completely before starting another action.</div><div class="turnNum">5</div><div class="turnText">Your turn does <strong>not</strong> automatically end because you passed, scored, were defended, used TACKLE, or lost possession.</div><div class="turnNum">6</div><div class="turnText">When you are finished, announce that your turn is over. Then move to the next living player in the fixed order.</div></div></section>
<section class="chapter" id="r8"><h3>8 — PASS</h3><ol><li>You may PASS only on your own turn.</li><li>You must currently have the Soccer Card.</li><li>Choose a living teammate and give them the Soccer Card.</li><li>No Token is added.</li><li>Your turn continues. The teammate who receives the ball does not immediately take a turn.</li></ol><div class="flowLine">YOU HAVE ⚽ → PASS → TEAMMATE HAS ⚽ → YOUR TURN STILL CONTINUES</div></section>
<section class="chapter" id="r9"><h3>9 — SHOOT</h3><ol><li>You must have the Soccer Card.</li><li>Play SHOOT on your own turn.</li><li>Choose one living opponent as the target.</li><li>Pause and allow the defending team to respond with DEFENSE.</li><li>If no DEFENSE successfully stops the attack, the target takes +1 Token.</li></ol><div class="flowCase good"><div class="flowTitle">NO DEFENSE</div><div class="flowLine">SHOOT → NO DEFENSE → GOAL</div><div class="result">Target +1 Token.<span class="ballResult">⚽ Soccer Card goes to the player who was scored on.</span></div></div></section>
<section class="chapter" id="r10"><h3>10 — DEFENSE</h3><p>DEFENSE is a reaction to an attack. It does not need to be the defender's normal turn.</p><ul><li>The target may play DEFENSE.</li><li>A living teammate of the target may also play DEFENSE for them.</li><li>If the first DEFENSE stands, the attack is stopped and the target takes 0 Tokens.</li><li>The Soccer Card goes to the player who played the successful DEFENSE.</li></ul><div class="flowLine">SHOOT → DEFENSE → STOPPED → 0 TOKENS → BALL TO DEFENDER</div><div class="tinyCheck">Because DEFENSE is a reaction, a player whose normal turn is skipped by YELLOW CARD may still play DEFENSE when their team is attacked.</div></section>
<section class="chapter" id="r11"><h3>11 — DRIBBLE PAST</h3><p>In Strategy Mode, DRIBBLE PAST is used only after the first DEFENSE to beat that DEFENSE and continue the same attack.</p><div class="flowCase good"><div class="flowTitle">NO SECOND DEFENSE</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → NO SECOND DEFENSE → GOAL</div><div class="result">Target +1 Token.<span class="ballResult">⚽ Soccer Card goes to the player who was scored on.</span></div></div><div class="tinyCheck">Strategy Mode DRIBBLE PAST does not look at the top of the draw pile.</div></section>
<section class="chapter" id="r12"><h3>12 — Second DEFENSE</h3><p>After DRIBBLE PAST beats the first DEFENSE, the defending side may try one more DEFENSE.</p><ol><li>Play a second DEFENSE.</li><li>At the same time, discard <strong>1 additional card</strong> from your hand.</li><li>If you cannot discard the extra card, you cannot make this second DEFENSE.</li><li>If successful, the target takes 0 Tokens.</li><li>The Soccer Card goes to the player who made that successful second DEFENSE.</li></ol><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → DEFENSE + DISCARD 1 → STOPPED</div></section>
<section class="chapter" id="r13"><h3>13 — TACKLE</h3><div class="kidRule"><strong>TACKLE cannot be stopped by DEFENSE.</strong></div><ol><li>Use TACKLE on <strong>your own turn</strong>.</li><li>Choose the player who currently has the Soccer Card.</li><li>Play TACKLE and take the Soccer Card from that player.</li><li>DEFENSE cannot cancel or block this TACKLE.</li><li>If your turn is still active and you have a legal SHOOT, you may attack after taking the ball.</li></ol><div class="flowCase chain"><div class="flowTitle">COMMON FOLLOW-UP</div><div class="flowLine">OPPONENT HAS ⚽ → TACKLE → YOU HAVE ⚽ → SHOOT</div><div class="result">TACKLE changes possession; it does not itself give anyone a Token.</div></div></section>
<section class="chapter" id="r14"><h3>14 — YELLOW CARD</h3><p>YELLOW CARD affects the <strong>next living player in the fixed turn order</strong>. You do not choose the target.</p><ul><li>If the next living player is an opponent, that opponent is skipped.</li><li>If the next living player is your teammate, <strong>your teammate is still skipped</strong>. YELLOW CARD does not protect teammates.</li><li>The skipped player does <strong>not draw a card</strong> for that skipped turn.</li><li>The skipped player cannot play normal on-turn actions during that skipped turn: no PASS, SHOOT, TACKLE, DRIBBLE PAST as an on-turn action, or another normal action that requires their turn.</li><li>After the skipped turn is passed over, play continues to the next living player in the fixed order.</li><li><strong>DEFENSE is still allowed</strong> while the player is skipped, because DEFENSE is a reaction to an attack, not a normal turn action.</li></ul><div class="flowCase chain"><div class="flowTitle">OPPONENT EXAMPLE</div><div class="flowLine">BLUE 1 USES YELLOW → GREEN 1'S NORMAL TURN IS SKIPPED</div><div class="result">Green 1 draws nothing and performs no normal turn actions. Green 1 may still DEFENSE if attacked before their next normal turn.</div></div><div class="flowCase stop"><div class="flowTitle">TEAMMATE EXAMPLE AFTER AN ELIMINATION</div><div class="flowLine">ORDER: BLUE 1 → BLUE 2 → GREEN 2</div><div class="result">If Blue 1 uses YELLOW, <strong>Blue 2 is skipped</strong> even though Blue 2 is Blue 1's teammate.</div></div></section>
<section class="chapter" id="r15"><h3>15 — Soccer Tokens, Reveal & Elimination</h3><ul><li><strong>0 Tokens:</strong> alive; Role hidden.</li><li><strong>1 Token:</strong> alive; Role hidden.</li><li><strong>2 Tokens:</strong> alive; reveal the Role immediately.</li><li>If the revealed Role is a normal Player, a later successful third Token eliminates that Player.</li><li>If the revealed Role is the Goalkeeper, the Goalkeeper passive becomes armed automatically.</li><li>When a Player is eliminated, discard that player's entire hand and skip their seat in all future normal turns.</li></ul></section>
<section class="chapter" id="r16"><h3>16 — Goalkeeper Passive Skill</h3><div class="kidRule"><strong>Automatic passive. Never manually activated.</strong></div><ol><li>The hidden Goalkeeper receives their <strong>second Token</strong> from a successful goal.</li><li>Reveal the Goalkeeper Role immediately.</li><li>Because that goal succeeded, the Soccer Card goes to the Goalkeeper as the scored-on player.</li><li>The Goalkeeper passive is now armed automatically.</li><li>The next attack that would successfully give this Goalkeeper the third Token is automatically canceled once.</li><li>No third Token is added from that canceled attack.</li><li>The Soccer Card is with the Goalkeeper after the save.</li><li>The passive is now used up.</li><li>The next successful third-token goal eliminates the Goalkeeper and ends the game.</li></ol><div class="flowLine">GK GETS TOKEN 2 → REVEAL → PASSIVE ARMED → NEXT WOULD-BE 3RD GOAL AUTO-SAVED → BALL TO GK</div></section>
<section class="chapter" id="r17"><h3>17 — Who Gets the Soccer Card?</h3><div class="flowCase good"><div class="flowTitle">SHOOT SCORES</div><div class="flowLine">SHOOT → GOAL</div><div class="result">Target +1 Token.<span class="ballResult">⚽ Ball → player who was scored on.</span></div></div><div class="flowCase stop"><div class="flowTitle">DEFENSE STOPS SHOOT</div><div class="flowLine">SHOOT → DEFENSE → STOPPED</div><div class="result">0 Tokens.<span class="ballResult">⚽ Ball → player who played the successful DEFENSE.</span></div></div><div class="flowCase good"><div class="flowTitle">DRIBBLE PAST BEATS DEFENSE</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → GOAL</div><div class="result">Target +1 Token.<span class="ballResult">⚽ Ball → player who was scored on.</span></div></div><div class="flowCase stop"><div class="flowTitle">SECOND DEFENSE STOPS IT</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → DEFENSE + DISCARD 1 → STOPPED</div><div class="result">0 Tokens.<span class="ballResult">⚽ Ball → player who played the successful second DEFENSE.</span></div></div><div class="flowCase chain"><div class="flowTitle">TACKLE</div><div class="flowLine">TACKLE → TAKE THE SOCCER CARD</div><div class="result">No Token. TACKLE cannot be blocked by DEFENSE.</div></div><div class="flowCase stop"><div class="flowTitle">GOALKEEPER PASSIVE SAVE</div><div class="flowLine">WOULD-BE 3RD GOAL → PASSIVE SAVE</div><div class="result">No third Token.<span class="ballResult">⚽ Ball → Goalkeeper.</span></div></div></section>
<section class="chapter" id="r18"><h3>18 — Full Attack Chains</h3><div class="flowCase good"><div class="flowTitle">A — CLEAN GOAL</div><div class="flowLine">SHOOT → GOAL</div><div class="result">+1 Token; ball to scored-on player.</div></div><div class="flowCase stop"><div class="flowTitle">B — FIRST DEFENSE WINS</div><div class="flowLine">SHOOT → DEFENSE → STOPPED</div><div class="result">0 Tokens; ball to successful defender.</div></div><div class="flowCase good"><div class="flowTitle">C — DRIBBLE WINS</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → GOAL</div><div class="result">+1 Token; ball to scored-on player.</div></div><div class="flowCase stop"><div class="flowTitle">D — SECOND DEFENSE WINS</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → DEFENSE + DISCARD 1 → STOPPED</div><div class="result">0 Tokens; ball to second defender.</div></div><div class="flowCase chain"><div class="flowTitle">E — TAKE THE BALL BACK AND ATTACK AGAIN</div><div class="flowLine">ATTACK RESOLVES → OPPONENT/DEFENDER HAS ⚽ → YOUR TURN STILL ACTIVE → TACKLE → YOU HAVE ⚽ → SHOOT AGAIN</div><div class="result">Legal because TACKLE is your own-turn possession action and cannot be stopped by DEFENSE.</div></div></section>
<section class="chapter" id="r19"><h3>19 — When Does a Turn End?</h3><ul><li>PASS does not end your turn.</li><li>A successful goal does not automatically end your turn.</li><li>A stopped attack does not automatically end your turn.</li><li>TACKLE does not automatically end your turn.</li><li>Losing the Soccer Card does not automatically end your turn.</li><li>Finish resolving any current attack/reaction chain before doing something else.</li><li>When you are done, end your turn and move to the next living player in the fixed order.</li><li>If that next living player is under YELLOW, skip their entire normal turn and move on again.</li></ul></section>
<section class="chapter" id="r20"><h3>20 — How to Win</h3><ol><li>Normal Players are eliminated when they receive a third Token.</li><li>At 2 Tokens, all Roles are revealed.</li><li>A Goalkeeper's passive automatically protects against one would-be third-token goal.</li><li>After that passive has been used, the next successful third-token goal eliminates the Goalkeeper.</li><li>The moment the opposing Goalkeeper is eliminated, your team wins.</li></ol></section><div class="manualCloseWrap"><button class="btn" id="manualClose">CLOSE RULEBOOK</button></div>`;const c=box.querySelector('#manualClose');if(c)c.onclick=()=>d.querySelector('#manualModal').classList.remove('show')}
 installManual();patchCards();new MutationObserver(()=>{installManual();patchCards()}).observe(d.body,{childList:true,subtree:true,characterData:true});
 const order=['SHOOT','DEFENSE','TACKLE','DRIBBLE'];function warm(i=0){if(i>=order.length)return;const key=order[i],img=new Image();img.decoding='async';img.onload=()=>{loaded.add(key);patchCards();setTimeout(()=>warm(i+1),120)};img.onerror=()=>setTimeout(()=>warm(i+1),120);img.src=ASSETS[key]}setTimeout(()=>warm(),700)
}
