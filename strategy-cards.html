<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Goal-Scoring Moment — Strategy Tutorial</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf6ff}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="strategy.html?v=20260817g" title="Strategy Mode Tutorial"></iframe><script>const f=document.getElementById('game');function install(){const d=f.contentDocument;if(!d)return;const st=d.createElement('style');st.textContent=`.shootArtHost{padding:2px!important;overflow:hidden!important;background:#fff!important}.shootArt{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:#fff;border-radius:7px}.flowStep.shootArtHost{width:27px;height:36px;display:inline-flex!important;padding:0!important;border-radius:5px}.pc.shootArtHost{padding:2px!important}.mini.shootArtHost{padding:3px!important}`;d.head.appendChild(st);const patch=()=>{d.querySelectorAll('.face,.pc,.flowStep,.mini').forEach(el=>{if(el.querySelector('.shootArt'))return;const t=(el.textContent||'').replace(/\s+/g,' ').trim();if(t==='SHOOT'||t==='SHOOT!'||t==='🎯 SHOOT'){el.classList.add('shootArtHost');el.innerHTML='<img class="shootArt" src="images/shoot-card.svg" alt="SHOOT card">'}});d.querySelectorAll('a[href="index.html"]').forEach(a=>a.target='_top')};patch();new MutationObserver(patch).observe(d.body,{childList:true,subtree:true,characterData:true})}f.addEventListener('load',install);</script></body></html>
