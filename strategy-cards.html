<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Goal-Scoring Moment — Strategy Tutorial</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf6ff}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="strategy.html?v=20260818j" title="Strategy Mode Tutorial"></iframe><script>const f=document.getElementById('game');function install(){const d=f.contentDocument;if(!d)return;const st=d.createElement('style');st.textContent=`.realCardHost{padding:0!important;overflow:hidden!important;background:transparent!important}.realCardArt{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:#fff;border-radius:6px}.face.realCardHost{border:0!important;background:transparent!important}.flowStep.realCardHost{width:33px;height:44px;display:inline-flex!important;padding:0!important;border-radius:4px;background:transparent!important;overflow:hidden!important}.pc.realCardHost{padding:0!important;background:transparent!important;border:0!important;overflow:hidden!important}.mini.realCardHost{padding:0!important;background:transparent!important;overflow:hidden!important}.manualBox{padding-bottom:8px!important}.manualLead{font-size:13px!important;line-height:1.55!important}.manualToc{grid-template-columns:1fr 1fr!important}.manualToc a{font-size:10px!important;line-height:1.25!important}.chapter h3{font-size:17px!important}.chapter p,.chapter li{font-size:12px!important;line-height:1.62!important}.kidRule{background:#eef7ff;border:2px solid #9fc7eb;border-radius:10px;padding:9px;margin:7px 0;font-size:12px;font-weight:800;line-height:1.5}.flowCase{border:2px solid #c5d9ec;border-radius:12px;background:#fff;padding:9px;margin:9px 0}.flowCase.good{border-color:#48a875;background:#f1fff7}.flowCase.stop{border-color:#e39b4f;background:#fff8ee}.flowCase.chain{border-color:#6b8fd8;background:#f4f7ff}.flowTitle{font-size:12px;font-weight:950;color:#123a73;margin-bottom:6px}.flowLine{background:#123a73;color:#fff;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:950;line-height:1.45;margin-bottom:6px}.result{font-size:12px;line-height:1.55;font-weight:800;color:#29445f}.ballResult{display:block;margin-top:5px;color:#8c4f00;font-weight:950}.tinyCheck{font-size:11px;line-height:1.5;background:#fff5ce;border-left:5px solid #e5bb3c;border-radius:8px;padding:8px;margin:7px 0}.turnBox{display:grid;grid-template-columns:auto 1fr;gap:7px 9px;align-items:start}.turnNum{width:24px;height:24px;border-radius:50%;background:#123a73;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:950}.turnText{font-size:12px;line-height:1.55;font-weight:750;color:#314a64}.manualCloseWrap{z-index:2}@media(max-width:700px){.manualToc{grid-template-columns:1fr!important}.manualToc a{font-size:11px!important}.chapter{padding:10px!important}.chapter p,.chapter li,.kidRule,.result,.turnText{font-size:12px!important}.flowLine{font-size:10px!important}}`;d.head.appendChild(st);const ASSETS={SHOOT:'images/shoot-card.png?v=20260818j',DEFENSE:'images/defense-card.png?v=20260818j',TACKLE:'images/tackle-card.png?v=20260818j',DRIBBLE:'images/dribble%20past-card.png?v=20260818j'};const loaded=new Set();function info(t){if(t.includes('SHOOT'))return['SHOOT','SHOOT card'];if(t.includes('DEFENSE'))return['DEFENSE','DEFENSE card'];if(t.includes('TACKLE'))return['TACKLE','TACKLE card'];if(t.includes('DRIBBLE PAST')||t==='DRIBBLE')return['DRIBBLE','DRIBBLE PAST card'];return null}const patch=()=>{d.querySelectorAll('.face,.pc,.flowStep,.mini').forEach(el=>{if(el.querySelector('.realCardArt'))return;const t=(el.textContent||'').replace(/\s+/g,' ').trim(),m=info(t);if(!m)return;const key=m[0];const urgent=el.classList.contains('flowStep')||el.classList.contains('pc')||!!el.closest('.card.target');if(!urgent&&!loaded.has(key))return;el.classList.add('realCardHost');const img=d.createElement('img');img.className='realCardArt';img.src=ASSETS[key];img.alt=m[1];img.decoding='async';el.textContent='';el.appendChild(img)});d.querySelectorAll('a[href="index.html"]').forEach(a=>a.target='_top')};function installManual(){const box=d.querySelector('#manualModal .manualBox');if(!box)return;box.innerHTML=`<div class="eyebrow" style="text-align:center">STRATEGY MODE</div><h2>COMPLETE RULEBOOK</h2><div class="manualLead"><strong>Read this from top to bottom the first time you play.</strong><br>Every rule below tells you exactly what to do, what happens next, who gets the Soccer Card, and whether the attack succeeded or failed.</div><div class="manualToc"><a href="#r1">1. Goal of the Game</a><a href="#r2">2. Make the Teams</a><a href="#r3">3. Secret Roles</a><a href="#r4">4. Set Up the Table</a><a href="#r5">5. Who Goes First</a><a href="#r6">6. Turn Order</a><a href="#r7">7. Your Turn Step by Step</a><a href="#r8">8. PASS</a><a href="#r9">9. SHOOT</a><a href="#r10">10. DEFENSE</a><a href="#r11">11. DRIBBLE PAST</a><a href="#r12">12. Second DEFENSE</a><a href="#r13">13. TACKLE</a><a href="#r14">14. YELLOW CARD</a><a href="#r15">15. Tokens & Elimination</a><a href="#r16">16. Goalkeeper Skill</a><a href="#r17">17. ALL Attack Results</a><a href="#r18">18. Advanced Same-Turn Combos</a><a href="#r19">19. End Your Turn</a><a href="#r20">20. How to Win</a></div><section class="chapter" id="r1"><h3>1 — Goal of the Game</h3><p>Your team is trying to eliminate the other team's hidden Goalkeeper.</p><div class="kidRule">A normal successful attack gives the target <strong>1 Soccer Token</strong>. A normal Player with 3 Soccer Tokens is out. If the Goalkeeper is eliminated, that team loses immediately.</div></section><section class="chapter" id="r2"><h3>2 — Make the Teams</h3><ol><li>Make a Blue Team and a Green Team.</li><li>Try to keep the teams as even as possible.</li><li>Players on the same team are teammates.</li><li>Players on the other team are opponents.</li></ol></section><section class="chapter" id="r3"><h3>3 — Secret Roles</h3><ol><li>Each team has exactly 1 Goalkeeper.</li><li>Everyone else is a Player.</li><li>You may show your team color.</li><li>Do <strong>not</strong> show whether you are the Goalkeeper.</li><li>Opponent roles stay hidden while they have 0, 1, or 2 Tokens.</li></ol><div class="tinyCheck">Important: Team color is public. Goalkeeper identity is secret.</div></section><section class="chapter" id="r4"><h3>4 — Set Up the Table</h3><div class="turnBox"><div class="turnNum">1</div><div class="turnText">Shuffle the Action Cards.</div><div class="turnNum">2</div><div class="turnText">Deal 5 Action Cards to every player.</div><div class="turnNum">3</div><div class="turnText">Keep your hand hidden from the other players.</div><div class="turnNum">4</div><div class="turnText">Put the Soccer Tokens where everyone can reach them.</div><div class="turnNum">5</div><div class="turnText">Keep the Soccer Card separate. It shows who has the ball. It is not a normal hand card.</div></div></section><section class="chapter" id="r5"><h3>5 — Who Goes First</h3><ol><li>Use Rock–Paper–Scissors.</li><li>The winning side attacks first.</li><li>The first player on that side receives the Soccer Card.</li><li>That player starts the first turn.</li></ol></section><section class="chapter" id="r6"><h3>6 — Turn Order</h3><p>Choose one fixed order before the game starts. Alternate teams when possible.</p><div class="flowLine">Example: BLUE 1 → GREEN 1 → BLUE 2 → GREEN 2 → repeat</div><div class="kidRule"><strong>PASS does not change the turn order.</strong> Giving the Soccer Card to a teammate does not make that teammate act immediately.</div></section><section class="chapter" id="r7"><h3>7 — Your Turn, Step by Step</h3><div class="turnBox"><div class="turnNum">1</div><div class="turnText"><strong>Draw 1 Action Card.</strong></div><div class="turnNum">2</div><div class="turnText">Look at your hand and decide what you want to do.</div><div class="turnNum">3</div><div class="turnText">You may play legal cards, PASS, attack, TACKLE the ball back, or continue another legal action.</div><div class="turnNum">4</div><div class="turnText"><strong>Your turn does not end automatically</strong> because you passed, attacked, scored, were defended, or used TACKLE.</div><div class="turnNum">5</div><div class="turnText">When you are finished, say: <strong>“My turn is over.”</strong> Then the next player in the fixed order takes a turn.</div></div></section><section class="chapter" id="r8"><h3>8 — PASS</h3><ol><li>You must have the Soccer Card.</li><li>Choose a living teammate.</li><li>Give that teammate the Soccer Card.</li><li>Your turn is still your turn.</li><li>Continue playing, or say your turn is over.</li></ol><div class="flowCase chain"><div class="flowTitle">PASS RESULT</div><div class="flowLine">YOU HAVE SOCCER → PASS → TEAMMATE HAS SOCCER</div><div class="result">No Token is given. No one else starts a turn yet.</div></div></section><section class="chapter" id="r9"><h3>9 — SHOOT</h3><ol><li>You must have the Soccer Card.</li><li>Play a SHOOT card.</li><li>Choose one living opponent as the target.</li><li>Give the defending side a chance to use DEFENSE.</li><li>If nobody successfully stops the attack, the SHOOT scores.</li></ol><div class="flowCase good"><div class="flowTitle">SHOOT SUCCESS — NO DEFENSE</div><div class="flowLine">SHOOT → NO DEFENSE → GOAL</div><div class="result">The target gets <strong>1 Soccer Token</strong>.<span class="ballResult">⚽ Soccer Card goes to the player who was scored on.</span></div></div></section><section class="chapter" id="r10"><h3>10 — DEFENSE</h3><p>The target or a living teammate may play DEFENSE against a SHOOT.</p><div class="flowCase stop"><div class="flowTitle">DEFENSE SUCCESS</div><div class="flowLine">SHOOT → DEFENSE → ATTACK STOPPED</div><div class="result">The target gets <strong>0 Tokens</strong>.<span class="ballResult">⚽ Soccer Card goes to the player who played the successful DEFENSE.</span></div></div><div class="kidRule">The attack is stopped, but the attacker's turn is still not automatically over.</div></section><section class="chapter" id="r11"><h3>11 — DRIBBLE PAST</h3><p>DRIBBLE PAST is used after the first DEFENSE. It breaks through that first DEFENSE and lets the same attack continue.</p><ol><li>Attacker plays SHOOT.</li><li>Defender plays DEFENSE.</li><li>Attacker plays DRIBBLE PAST.</li><li>The first DEFENSE is beaten.</li><li>The defending side may now try a special second DEFENSE.</li></ol><div class="flowCase good"><div class="flowTitle">DRIBBLE PAST SUCCESS — NO SECOND DEFENSE</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → NO SECOND DEFENSE → GOAL</div><div class="result">The target gets <strong>1 Soccer Token</strong>.<span class="ballResult">⚽ Soccer Card goes to the player who was scored on.</span></div></div><div class="tinyCheck">Strategy Mode only: DRIBBLE PAST does not look at the Draw Pile.</div></section><section class="chapter" id="r12"><h3>12 — Second DEFENSE</h3><p>After DRIBBLE PAST, the defending side gets one more chance to stop that same attack.</p><ol><li>Play a second DEFENSE.</li><li>Also discard 1 extra card from your hand.</li><li>If you cannot discard the extra card, you cannot use the second DEFENSE.</li></ol><div class="flowCase stop"><div class="flowTitle">SECOND DEFENSE SUCCESS</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → DEFENSE + DISCARD 1 → STOPPED</div><div class="result">The target gets <strong>0 Tokens</strong>.<span class="ballResult">⚽ Soccer Card goes to the player who played the successful second DEFENSE.</span></div></div></section><section class="chapter" id="r13"><h3>13 — TACKLE</h3><p>TACKLE is played on <strong>your own turn</strong> to take the Soccer Card from the player who currently has it.</p><ol><li>Choose the player who has the Soccer Card.</li><li>Play TACKLE.</li><li>Take the Soccer Card.</li><li>If you still have a SHOOT, you may attack again during the same turn.</li></ol><div class="kidRule">DEFENSE does not stop TACKLE. TACKLE is not a reaction card.</div></section><section class="chapter" id="r14"><h3>14 — YELLOW CARD</h3><p>Use YELLOW CARD on your own turn. It skips the next living player in the fixed turn order one time.</p><div class="flowLine">YOUR TURN → YELLOW CARD → NEXT LIVING PLAYER IS SKIPPED</div><div class="tinyCheck">You do not choose any player you want. Follow the fixed turn order.</div></section><section class="chapter" id="r15"><h3>15 — Soccer Tokens & Elimination</h3><ul><li><strong>0 Tokens:</strong> still playing.</li><li><strong>1 Token:</strong> still playing.</li><li><strong>2 Tokens:</strong> still playing; role is still hidden.</li><li><strong>3 Tokens on a normal Player:</strong> that Player is out and reveals the Role Card.</li><li>When a player is out, remove that player's hand from play.</li></ul></section><section class="chapter" id="r16"><h3>16 — Goalkeeper Skill</h3><p>The Goalkeeper has one special save.</p><ol><li>The Goalkeeper is hidden while at 0, 1, or 2 Tokens.</li><li>If a successful attack would give the hidden Goalkeeper the <strong>third Token</strong>, reveal the Goalkeeper.</li><li>That third-token attack is canceled once.</li><li>The Goalkeeper stays at 2 Tokens.</li><li>The Goalkeeper receives the Soccer Card.</li><li>The Goalkeeper skill is now used.</li><li>The next successful attack that gives that Goalkeeper the third Token eliminates the Goalkeeper.</li></ol><div class="flowCase stop"><div class="flowTitle">GOALKEEPER'S ONE-TIME SAVE</div><div class="flowLine">SHOOT WOULD GIVE 3RD TOKEN → REVEAL GOALKEEPER → ATTACK CANCELED</div><div class="result">Goalkeeper stays at 2 Tokens.<span class="ballResult">⚽ Soccer Card goes to the Goalkeeper.</span></div></div></section><section class="chapter" id="r17"><h3>17 — ALL Attack Results</h3><div class="flowCase good"><div class="flowTitle">A. SHOOT SCORES</div><div class="flowLine">SHOOT → SUCCESS</div><div class="result">Target +1 Token.<span class="ballResult">⚽ Ball goes to the player who was scored on.</span></div></div><div class="flowCase stop"><div class="flowTitle">B. FIRST DEFENSE STOPS SHOOT</div><div class="flowLine">SHOOT → DEFENSE → STOPPED</div><div class="result">No Token.<span class="ballResult">⚽ Ball goes to the player who used DEFENSE.</span></div></div><div class="flowCase good"><div class="flowTitle">C. DRIBBLE PAST BREAKS THE FIRST DEFENSE</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → SUCCESS</div><div class="result">Target +1 Token.<span class="ballResult">⚽ Ball goes to the player who was scored on.</span></div></div><div class="flowCase stop"><div class="flowTitle">D. SECOND DEFENSE STOPS DRIBBLE PAST</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → DEFENSE + DISCARD 1 → STOPPED</div><div class="result">No Token.<span class="ballResult">⚽ Ball goes to the player who used the successful second DEFENSE.</span></div></div><div class="flowCase chain"><div class="flowTitle">E. AFTER A DEFENSE, TACKLE THE BALL BACK</div><div class="flowLine">SHOOT → DEFENSE → TACKLE → SHOOT</div><div class="result">The first SHOOT failed. DEFENSE gave the ball to the defender. Because it is still your turn, you may TACKLE the ball back and SHOOT again if you have the cards.</div></div><div class="flowCase chain"><div class="flowTitle">F. AFTER SECOND DEFENSE, TACKLE AND ATTACK AGAIN</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → DEFENSE + DISCARD 1 → TACKLE → SHOOT</div><div class="result">The long attack was stopped. The successful defender got the ball. Your turn is still active, so TACKLE can take the ball back and a new SHOOT can begin.</div></div><div class="flowCase chain"><div class="flowTitle">G. EVEN AFTER YOU SCORE, YOUR TURN CAN CONTINUE</div><div class="flowLine">SHOOT → GOAL → TARGET GETS BALL → TACKLE → SHOOT AGAIN</div><div class="result">A successful goal gives the Soccer Card to the target. If your turn is still active and you have TACKLE, you may steal it back and attack again.</div></div></section><section class="chapter" id="r18"><h3>18 — Advanced Same-Turn Combos</h3><p>These examples are here so nobody has to guess what happens.</p><div class="flowCase chain"><div class="flowTitle">COMBO 1 — DEFENSE, THEN TAKE THE BALL BACK</div><div class="flowLine">SHOOT → DEFENSE → TACKLE → SHOOT</div><div class="result"><strong>Step 1:</strong> First SHOOT is stopped.<br><strong>Step 2:</strong> Defender gets the Soccer Card.<br><strong>Step 3:</strong> Your turn is still active.<br><strong>Step 4:</strong> Use TACKLE to steal the Soccer Card.<br><strong>Step 5:</strong> If you have another SHOOT, attack again.</div></div><div class="flowCase chain"><div class="flowTitle">COMBO 2 — DRIBBLE, SECOND DEFENSE, THEN TACKLE</div><div class="flowLine">SHOOT → DEFENSE → DRIBBLE PAST → DEFENSE + DISCARD 1 → TACKLE → SHOOT</div><div class="result"><strong>Step 1:</strong> First DEFENSE is beaten by DRIBBLE PAST.<br><strong>Step 2:</strong> Second DEFENSE + discard 1 stops the attack.<br><strong>Step 3:</strong> Second defender gets the Soccer Card.<br><strong>Step 4:</strong> Your turn is still active.<br><strong>Step 5:</strong> TACKLE the ball back.<br><strong>Step 6:</strong> Start a new SHOOT.</div></div><div class="flowCase chain"><div class="flowTitle">COMBO 3 — GOALKEEPER SAVE, THEN FINISH</div><div class="flowLine">SHOOT → GOALKEEPER SAVE → BALL TO GOALKEEPER → TACKLE → SHOOT → 3RD TOKEN → WIN</div><div class="result"><strong>Step 1:</strong> Goalkeeper would receive the third Token.<br><strong>Step 2:</strong> Goalkeeper's one-time skill cancels that scoring attack.<br><strong>Step 3:</strong> Goalkeeper stays at 2 Tokens and gets the Soccer Card.<br><strong>Step 4:</strong> Your turn is still active.<br><strong>Step 5:</strong> TACKLE the Soccer Card back.<br><strong>Step 6:</strong> SHOOT again.<br><strong>Step 7:</strong> If the new attack succeeds, the Goalkeeper receives the third Token and is eliminated.</div></div><div class="kidRule">Every time you play a new SHOOT after TACKLE, treat it as a new attack. The defending side gets its normal chance to DEFEND again.</div></section><section class="chapter" id="r19"><h3>19 — When Does Your Turn End?</h3><p>Your turn ends <strong>only when you decide you are finished and say your turn is over.</strong></p><div class="tinyCheck">PASS does not end it. SHOOT does not end it. A goal does not end it. DEFENSE does not end it. TACKLE does not end it. The Goalkeeper save does not end it.</div><p>After you say your turn is over, move to the next living player in the fixed turn order.</p></section><section class="chapter" id="r20"><h3>20 — How to Win</h3><ul><li>Your team wins immediately when the opposing Goalkeeper is eliminated.</li><li>Your team also wins if every player on the opposing team is eliminated.</li></ul><div class="kidRule">The most important thing to remember: <strong>successful attack = target gets 1 Token and the Soccer Card. Successful DEFENSE = no Token and the defender gets the Soccer Card.</strong></div></section><div class="manualCloseWrap"><button class="btn green" id="manualCloseV2">CLOSE RULEBOOK</button></div>`;const close=box.querySelector('#manualCloseV2');if(close)close.onclick=()=>{d.getElementById('manualModal').classList.remove('show');patch()}}installManual();patch();new MutationObserver(patch).observe(d.body,{childList:true,subtree:true,characterData:true});const order=['SHOOT','DEFENSE','TACKLE','DRIBBLE'];function warm(i=0){if(i>=order.length)return;const key=order[i],img=new Image();img.decoding='async';img.onload=()=>{loaded.add(key);patch();setTimeout(()=>warm(i+1),120)};img.onerror=()=>setTimeout(()=>warm(i+1),120);img.src=ASSETS[key]}setTimeout(()=>warm(),700)}f.addEventListener('load',install);</script></body></html>
