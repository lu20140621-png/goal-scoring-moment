lor:#fff;padding:8px;pointer-events:none;box-shadow:0 6px 18px #0008}.teamPanel.left{left:8px}.teamPanel.right{right:8px}.teamTitle{text-align:center;font-size:12px;font-weight:950;padding:5px;border-bottom:1px solid #4c8fc4;margin-bottom:7px}.teamPanel.left .teamTitle{color:#9dc7ff}.teamPanel.right .teamTitle{color:#8ff0b8}.mirror{background:#0b2743;border:1px solid #2c638f;border-radius:8px;padding:6px;margin:6px 0}.mirrorName{font-size:10px;font-weight:950}.mirrorMeta{font-size:8px;line-height:1.45;color:#bcd0e3;margin-top:3px}.gameLog{position:absolute;left:13.8%;right:13.8%;bottom:4px;height:72px;background:#061a2df2;border:2px solid #1f659e;border-radius:10px;color:#d7e8f5;padding:8px 10px;font-size:9px;line-height:1.45;overflow:hidden}.gameLog b{color:#ffd75a}.gsmGame .seat{z-index:7!important;width:92px!important;min-height:58px!important;padding:5px!important;border-width:2px!important;border-radius:10px!important;box-shadow:0 4px 12px #0007!important}.gsmGame .seat .roleBox{display:none!important}.gsmGame .seatName{font-size:10px!important}.gsmGame .teamTag{font-size:7px!important}.gsmGame .seatBottom{margin-top:3px!important}.gsmGame .token{width:14px!important;height:14px!important}.gsmGame .ball{font-size:7px!important;padding:2px 4px!important}.gsmGame .seat.top{top:92px!important;left:61%!important;transform:none!important}.gsmGame .seat.left{left:28%!important;top:32%!important}.gsmGame .seat.right{right:28%!important;top:32%!important}.gsmGame .seat.you{left:38%!important;bottom:214px!important}.gsmGame .lesson{left:50%!important;right:auto!important;top:auto!important;bottom:245px!important;width:min(560px,48vw)!important;transform:translateX(-50%)!important;z-index:12!important}.gsmGame .lessonBox{background:#f8fbfff2!important;border:2px solid #2868ac!important;box-shadow:0 5px 18px #0007!important;padding:7px 10px!important}.gsmGame .played{height:72px!important;background:#071f35dd!important;border:2px solid #5ea6d8!important}.gsmGame .pc{width:52px!important;height:64px!important}.gsmGame .what{left:13.8%!important;right:13.8%!important;bottom:82px!important;height:82px!important;background:#071c31f5!important;border:2px solid #2a78bd!important;color:#fff!important;border-radius:8px!important;padding:8px 280px 8px 12px!important;z-index:15!important}.gsmGame .what b{color:#ffd75a!important;font-size:10px!important}.gsmGame .what div{color:#d8e8f6!important;font-size:9px!important}.gsmGame .pass,.gsmGame .endTurn{bottom:101px!important;z-index:22!important;font-size:10px!important}.gsmGame .pass{right:15.5%!important}.gsmGame .endTurn{right:25%!important}.gsmGame .handLabel{right:38%!important;bottom:154px!important;background:#123a73!important;z-index:20!important}.gsmGame .hand{left:50%!important;right:auto!important;bottom:76px!important;width:470px!important;height:92px!important;transform:translateX(-50%)!important;z-index:18!important}.gsmGame .card{width:63px!important;height:88px!important}.gsmGame .guide{z-index:50!important}.realCardHost{padding:0!important;overflow:hidden!important;background:transparent!important}.realCardArt{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:transparent!important;border-radius:6px}.face.realCardHost,.pc.realCardHost{border:0!important;background:transparent!important}.flowStep.realCardHost{width:33px;height:44px;display:inline-flex!important;padding:0!important;overflow:hidden!important}.gsmGame .modal{z-index:200!important}.gsmGame .modal .box{box-shadow:0 16px 50px #0009}.gsmGame .modal.show{pointer-events:auto!important}@media(max-width:700px){.gsmGame .top{height:50px!important}.gsmGame .progress{top:50px;width:96vw}.gsmGame .board{height:calc(100svh - 50px)!important;min-height:680px!important;background:repeating-linear-gradient(90deg,#2ba45e 0 52px,#249454 52px 104px)!important}.gsmGame .board:before{inset:55px 8px 185px!important}.gsmGame .teamPanel{display:none!important}.scoreHud{top:8px;grid-template-columns:8 r table.</div></div>`;d.querySelector('#board').appendChild(hud);const ASSETS={SHOOT:'images/shoot-card.png?v=20260824game1',DEFENSE:'images/defense-card.png?v=20260824game1',TACKLE:'images/tackle-card.png?v=20260824game1',DRIBBLE:'images/dribble%20past-card.png?v=20260824game1',YELLOW:'images/yellow-card.png?v=20260824game1'};const loaded=new Set();function info(t){t=(t||'').toUpperCase();if(t.includes('YELLOW'))return['YELLOW','YELLOW CARD'];if(t.includes('SHOOT'))return['SHOOT','SHOOT card'];if(t.includes('DEFENSE'))return['DEFENSE','DEFENSE card'];if(t.includes('TACKLE'))return['TACKLE','TACKLE card'];if(t.includes('DRIBBLE PAST')||t.trim()==='DRIBBLE')return['DRIBBLE','DRIBBLE PAST card'];return null}function patchCards(){d.querySelectorAll('.face,.pc,.flowStep,.mini').forEach(el=>{if(el.querySelector('.realCardArt'))return;const t=(el.textContent||'').replace(/\s+/g,' ').trim(),m=info(t);if(!m)return;const key=m[0];const urgent=el.classList.contains('flowStep')||el.classList.contains('pc')||!!el.closest('.card.target');if(!urgent&&!loaded.has(key))return;el.classList.add('realCardHost');const img=d.createElement('img');img.className='realCardArt';img.src=ASSETS[key];img.alt=m[1];img.decoding='async';el.textContent='';el.appendChild(img)})}function mirrorSeat(id){const el=d.getElementById(id);if(!el)return'';const name=el.querySelector('.seatName')?.textContent?.trim()||id;const role=el.querySelector('.roleValue')?.textContent?.trim()||'HIDDEN';const balls=el.querySelectorAll('.token').length;const hasBall=!!el.querySelector('.ball');return`<div class="mirror"><div class="mirrorName">${name}${hasBall?' ⚽':''}</div><div class="mirrorMeta">ROLE: ${role}<br>TOKENS: ${balls}</div></div>`}function syncHud(){const b=d.getElementById('blueMirrors'),g=d.getElementById('greenMirrors');if(b)b.innerHTML=mirrorSeat('H0')+mirrorSeat('H1');if(g)g.innerHTML=mirrorSeat('A0')+mirrorSeat('A1');const lesson=d.getElementById('lname')?.textContent?.trim(),num=d.getElementById('ln')?.textContent?.trim();const t=d.getElementById('turnHud');if(t)t.textContent=(num||'STRATEGY TUTORIAL')+(lesson?' • '+lesson:'');const played=d.getElementById('played');const log=d.getElementById('logText');if(log&&played){const txt=(played.textContent||'').replace(/\s+/g,' ').trim();log.textContent=txt?('On field: '+txt):'Tutorial ready. Follow the highlighted action and play the matching physical card on your table.'}}const mb=d.getElementById('manualBtn');if(mb){mb.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();overlay.classList.add('show')},true)}d.querySelectorAll('a[href="index.html"]').forEach(a=>a.target='_top');patchCards();syncHud();new MutationObserver(()=>{patchCards();syncHud()}).observe(d.body,{childList:true,subtree:true,characterData:true});const order=['SHOOT','DEFENSE','TACKLE','DRIBBLE','YELLOW'];function warm(i=0){if(i>=order.length)return;const key=order[i],img=new Image();img.decoding='async';img.onload=()=>{loaded.add(key);patchCards();setTimeout(()=>warm(i+1),100)};img.onerror=()=>setTimeout(()=>warm(i+1),100);img.src=ASSETS[key]}setTimeout(()=>warm(),500)}f.addEventListener('load',install);</script></body></html>
